[package]
name = "hyprwhich"
version = "1.0.0"
edition = "2021"
authors = ["Hyprland Community"]
description = "Keybinding search HUD and discovery palette for Hyprland"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hyprwhich/hyprwhich"
keywords = ["hyprland", "wayland", "keybindings", "hud", "cheatsheet"]
categories = ["command-line-utilities"]

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
gdk = "0.18"
glib = "0.18"
pango = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
